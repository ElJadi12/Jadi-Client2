<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadi Client — Modules</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M6 38 L18 14 L26 28 L31 20 L42 38 Z" stroke="white" stroke-width="3" stroke-linejoin="round"/>
            <path d="M4 12 A20 20 0 0 1 44 12" stroke="white" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <span>JADI</span>
          <span>CLIENT</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
          <span>Modules</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17.5 14c2.5 0 4 1.8 4 4.5"/></svg>
          <span>Social</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/><path d="M6 20c0-4 2.7-7 6-7s6 3 6 7"/><path d="M4 12l3-2M20 12l-3-2"/></svg>
          <span>Cosmetics</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h1M10 10h1M13.5 10h1M17 10h1M8 14h8"/></svg>
          <span>Macros</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
          <span>Waypoints</span>
        </button>
        <button class="nav-item">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20.5c0-4.1 3.4-7 7.5-7s7.5 2.9 7.5 7"/></svg>
          <span>Profiles</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="ghost-btn">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>
          <span>Settings</span>
        </button>
        <button class="ghost-btn">
          <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18" stroke-dasharray="3 3"/><rect x="8" y="8" width="8" height="8" rx="1.5"/></svg>
          <span>Edit HUD</span>
        </button>
        <p class="date">27 Sep 2026, 4:48 pm</p>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1>Modules</h1>
          <p class="subtitle">Configure built-in client mods</p>
        </div>
        <button class="icon-btn" id="searchBtn" title="Search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
      </header>

      <div class="search-box" id="searchBox">
        <input type="text" id="searchInput" placeholder="Search modules..." autocomplete="off" />
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="hud">HUD</button>
        <button class="tab" data-filter="combat">Combat</button>
        <button class="tab" data-filter="gamemode">Gamemode</button>
        <button class="tab" data-filter="mechanic">Mechanic</button>
      </div>

      <section class="grid" id="grid">
        <!-- cards are generated by script.js -->
      </section>

      <p class="empty" id="empty" hidden>No modules found.</p>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
